<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img"><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.ttl{font-size:15px;font-weight:600;fill:#1a1a1a}.sub{font-size:11.5px;fill:#6b6b6b}.ax{font-size:11px;fill:#6b6b6b}.lbl{font-size:11px;fill:#1a1a1a}.note{font-size:11px;fill:#6b6b6b}</style><rect width="720" height="420" fill="#ffffff"/><text class="ttl" x="70" y="24">Effective sample size is the session count, not the trade count</text><text class="sub" x="70" y="40">The same data, the same statistic — only the unit of independence changes.</text><line x1="140.7" y1="46" x2="140.7" y2="364" stroke="#d8d8d8" stroke-width="1"/><text class="ax" x="140.7" y="382" text-anchor="middle">-5</text><line x1="282.0" y1="46" x2="282.0" y2="364" stroke="#d8d8d8" stroke-width="1"/><text class="ax" x="282.0" y="382" text-anchor="middle">+0</text><line x1="423.4" y1="46" x2="423.4" y2="364" stroke="#d8d8d8" stroke-width="1"/><text class="ax" x="423.4" y="382" text-anchor="middle">+5</text><line x1="564.8" y1="46" x2="564.8" y2="364" stroke="#d8d8d8" stroke-width="1"/><text class="ax" x="564.8" y="382" text-anchor="middle">+10</text><line x1="282.0" y1="46" x2="282.0" y2="364" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="3,3"/><line x1="641.1" y1="103.8" x2="256.0" y2="103.8" stroke="#6b6b6b" stroke-width="2"/><circle cx="641.1" cy="103.8" r="5.5" fill="#2a4b8d" stroke="#fff" stroke-width="1.4"/><circle cx="256.0" cy="103.8" r="5.5" fill="#b3261e" stroke="#fff" stroke-width="1.4"/><text class="lbl" x="649.1" y="107.8" text-anchor="start">+12.7</text><text class="lbl" x="248.0" y="107.8" text-anchor="end">-0.92</text><text class="lbl" x="78.5" y="74.9" text-anchor="start">gap-down cell</text><line x1="491.3" y1="190.5" x2="293.4" y2="190.5" stroke="#6b6b6b" stroke-width="2"/><circle cx="491.3" cy="190.5" r="5.5" fill="#2a4b8d" stroke="#fff" stroke-width="1.4"/><circle cx="293.4" cy="190.5" r="5.5" fill="#b3261e" stroke="#fff" stroke-width="1.4"/><text class="lbl" x="499.3" y="194.5" text-anchor="start">+7.4</text><text class="lbl" x="285.4" y="194.5" text-anchor="end">+0.40</text><text class="lbl" x="78.5" y="161.6" text-anchor="start">panic x mid-cap</text><line x1="649.6" y1="277.3" x2="120.9" y2="277.3" stroke="#6b6b6b" stroke-width="2"/><circle cx="649.6" cy="277.3" r="5.5" fill="#2a4b8d" stroke="#fff" stroke-width="1.4"/><circle cx="120.9" cy="277.3" r="5.5" fill="#b3261e" stroke="#fff" stroke-width="1.4"/><text class="lbl" x="657.6" y="281.3" text-anchor="start">+13.0</text><text class="lbl" x="112.9" y="281.3" text-anchor="end">-5.70</text><text class="lbl" x="78.5" y="248.4" text-anchor="start">small-cap bounce</text><text class="lbl" x="78.5" y="60.5" text-anchor="start">&#9679; per-event t</text><text class="lbl" x="208.5" y="60.5" text-anchor="start">&#9679; session-clustered t</text><text class="note" x="70" y="412">One panic morning produced 62 signals; one cell held 1,220 events over 304 sessions.</text><text class="note" x="70" y="398">A per-event standard error is too small by roughly sqrt(n/S) before any other consideration.</text><line x1="70" y1="364" x2="692" y2="364" stroke="#1a1a1a" stroke-width="1.3"/><line x1="70" y1="46" x2="70" y2="364" stroke="#1a1a1a" stroke-width="1.3"/><text class="ax" x="381" y="402" text-anchor="middle">t-statistic</text><text class="ax" x="16" y="205" text-anchor="middle" transform="rotate(-90 16 205)"></text></svg>